name: prcheck
run-name: Deploying the mod...

on:
  pull_request:
    types:
      - opened
    paths:
      - 'levels/**'

jobs:
  prcheck:
    runs-on: ubuntu-latest
    steps:
      - name: print stuff
        env:
          PRINT: ${{ github.event.pull_request.changed_files }}
        run: echo "$PRINT"

      
