name: prcheck
run-name: Checking the pull request...

on:
  pull_request:
    types:
      - opened
    paths:
      - 'levels/**'

jobs:
  prcheck:
    runs-on: ubuntu-latest
    steps:
      - name: print stuff
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff "$PR" --name-only -R "$REPO"

      
