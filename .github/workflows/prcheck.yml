name: prcheck
run-name: Checking the pull request...

on:
  pull_request:
    types:
      - opened
    paths:
      - 'levels/**'
      - 'info/**'

jobs:
  prcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Download python script
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh repo read-file prcheck.py -R "$REPO" --output prcheck.py
      - name: Check the PR for validity
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: python3 prcheck.py

  prmerge:
    needs: prcheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Accept the pull request
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$PR" --auto -r -R "$REPO"